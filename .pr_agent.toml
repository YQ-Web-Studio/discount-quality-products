# Minimal repo config — model, fallback_models, reasoning_effort, severity scale,
# and extra_instructions are centrally managed by YQ-Web-Studio/.github/pr-review.yml
# (with DQP architectural invariants passed via workflow inputs.extra_instructions so
# repo rules append to rather than overwrite the org adversarial review rubric).

[config]
git_provider = "github"
patch_extra_lines_before = 15
patch_extra_lines_after = 10

[pr_reviewer]
require_focused_review = false
require_score_review = true
require_tests_review = true
require_security_review = true

[pr_code_suggestions]
focus_only_on_problems = true
num_code_suggestions_per_chunk = 6
